name: Build & Publish Docker Image

# PR 仅验证 amd64；发布时在原生 amd64 / arm64 runner 上并行构建。
# 镜像按摘要暂存，Python / Go 检查和两个架构全部通过后才发布正式标签。
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的新提交替代旧构建；版本标签的发布不被自动中断。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Dependency vulnerability audit (app requirements)
        # SEC-P3-7：对应用直传依赖做 pip-audit（含传递依赖）。
        # 出现已知 CVE 即红——这正是目的：把「带洞发版」拦在合并前。
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt
      - name: Offline regression and project checks
        run: python scripts/check_project.py

  proxy-bridge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: proxybridge/go.mod
          cache-dependency-path: proxybridge/go.sum
      # ENG-P3-13（2026-11 收尾）：go test 只隐式跑 vet 子集，且此前从未
      # 校验过 gofmt（全仓曾为 8 空格缩进，收尾轮已统一 gofmt -w）。
      # 未格式化或 vet 可疑结构现在在合并前拦下。
      - name: Static checks (gofmt + go vet)
        working-directory: proxybridge
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt（本地执行 gofmt -w . 修复）："; echo "$unformatted"; exit 1
          fi
          go vet ./...
      - name: Protocol integration and race checks
        working-directory: proxybridge
        run: go test -race -count=1 -timeout=90s ./...
      # ENG-P3-4：依赖树含 yuhaiin 间接拖入的 gvisor / tailscale 非官方
      # fork（NOTICE.txt 已记录 fork 许可缺口），安全更新依赖单一维护者——
      # govulncheck 对 go.sum 锁定的依赖树做漏洞扫描（CI 侧兜底；go.sum
      # 保持锁定，扫描不改变依赖版本）。
      - name: Vulnerability scan (govulncheck)
        working-directory: proxybridge
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # CGO_ENABLED=0 的生产编译由 Docker 构建完成，不再生成未使用的副本。

  build:
    # 与测试并行：此处只推摘要，正式标签由 publish 在全部检查通过后生成。
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"arch":"amd64","runner":"ubuntu-24.04"}]' || '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Normalize image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            type=raw,value=main-{{sha}},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Build native image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          # PR 不推镜像；发布构建按摘要推送，避免并发覆盖正式标签。
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) }}
          labels: ${{ steps.meta.outputs.labels }}
          # 架构分桶防止相互覆盖；缓存服务故障不阻断已成功的镜像构建。
          cache-from: type=gha,scope=image-${{ matrix.arch }},version=2
          cache-to: type=gha,scope=image-${{ matrix.arch }},version=2,mode=max,ignore-error=true,timeout=3m
      - name: Export image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: [test, proxy-bridge, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Normalize image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) }}
          tags: |
            type=raw,value=main-{{sha}},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # 每个架构必须且只应提供一个摘要，缺失时禁止发布单架构 latest。
          shopt -s nullglob
          digests=(*)
          [[ ${#digests[@]} -eq 2 ]]
          sources=()
          for digest in "${digests[@]}"; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          tags=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || tags+=(--tag "$tag")
          done <<< "$TAGS"
          [[ ${#tags[@]} -gt 0 ]]
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
