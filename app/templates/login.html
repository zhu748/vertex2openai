<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7fb">
  <title>登录 · agentplatform2api</title>
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/console.css">
  <script src="/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-brand">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect width="40" height="40" rx="11" fill="#6563dc"/>
        <path d="M11 16H28M23 12L28 16L23 20M29 24H12M17 20L12 24L17 28" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <strong>agentplatform<span>2api</span></strong>
    </div>
    <section class="card login-card" aria-labelledby="login-title">
      <h1 id="login-title">登录控制台</h1>
      <p class="login-description">请输入访问密码，管理通道、模型与请求。</p>
      <form id="login-form">
        <label for="pw">访问密码（API_KEY）</label>
        <div class="password-wrap">
          <input id="pw" name="password" type="password" class="inp" placeholder="请输入访问密码" autofocus required autocomplete="current-password" aria-describedby="err">
          <button id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false">显示</button>
        </div>
        <button id="login-submit" class="btn" type="submit">进入控制台 <span aria-hidden="true">→</span></button>
        <p id="err" class="login-error" role="alert" aria-live="polite"></p>
      </form>
    </section>
    <p class="login-footer">OpenAI 兼容代理 · Gemini Agent Platform 双通道</p>
  </main>
</body>
</html>
