services:
  openai-to-gemini:
    image: ghcr.io/zhu748/vertex2openai:latest
    container_name: vertex2openai
    ports:
      # SEC-P1-1：默认只绑回环地址——直接照抄示例也不会把控制台（可导出
      # 完整 Google Cookie）暴露到公网。需要外部访问时，请在前面架反代并
      # 配置 TLS（示例见 README「生产部署」），不要改成 0.0.0.0 裸暴露：
      # 登录口令、粘贴的 Cookie、reveal 回传值都会明文过网。
      - "127.0.0.1:8050:7860"
    volumes:
      # S-3：不挂卷的话，docker compose up --force-recreate 或升级镜像后
      # web_state.json 会丢失，Cookie 与全部控制台设置都要重配。
      - ./data:/app/data
    environment:
      # 状态文件目录（web_state.json 落在这里）
      - STATE_DIR=/app/data
      # Protect this adapter's OpenAI-compatible API.
      # ⚠️ 必须改成强口令：留默认值/公开占位值时服务会拒绝启动（ALLOW_DEFAULT_KEY=true 可显式放行，仅限本地调试）。
      # 未设置 ADMIN_PASSWORD 时它同时也是控制台登录口令；要分享 API 给朋友，
      # 请另设 ADMIN_PASSWORD 把控制台口令与 API Key 分开。
      - API_KEY=change-me-please
      # 可选：控制台管理口令（推荐设置；留空 = 沿用上面的 API_KEY 登录控制台）
      # - ADMIN_PASSWORD=your-strong-console-password
      # Required: one or more Gemini Express Mode API keys, separated by commas.
      - VERTEX_EXPRESS_API_KEY=your_vertex_express_api_key
      # Optional: Key + Cookie simultaneous use. With both configured on first boot,
      # mixed mode is inferred; saved console settings take precedence thereafter.
      # - UPSTREAM_MODE=mixed
      # - 'VERTEX_EXPRESS_API_KEYS=[{"key":"key-a","project_id":"project-a"},{"key":"key-b","project_id":"project-b"}]'
      # - 'GOOGLE_COOKIES=[{"cookie":"SAPISID=cookie-a; SID=sid-a","project_id":"project-a"},{"cookie":"SAPISID=cookie-b; SID=sid-b" ,"project_id":"project-b"}]'
      # Optional: set true to rotate all enabled accounts in order instead of random selection.
      - ROUNDROBIN=false
      # Optional: fake streaming keeps client connections alive while waiting for non-streaming Gemini responses.
      - FAKE_STREAMING=false
      - FAKE_STREAMING_INTERVAL=1.0
      # Optional: 全局出站代理（仅作初始值，控制台保存后以控制台为准）。
      # 支持 http:// / https:// / socks5:// / socks5h:// 原生协议，
      # 也可直接填 vless:// vmess:// trojan:// ss:// socks4:// hysteria2:// tuic://
      # 分享链接（镜像内已置 sing-box，自动转成本地 socks5）。
      # TURN / TURNS / SSTP 节点也可直接填写（镜像内置 vertex-proxy-bridge）：
      # - 'PROXY_URLS=["turns://user:pass@turn.example.com:5349","sstp://user:pass@vpn.example.com:443"]'
      # - PROXY_BRIDGE_IDLE_MINUTES=30
      # 自定义 CA 需只读挂载 PEM 文件，再在节点高级设置中填写容器内路径。
      # 每个 Key / Cookie 还可单独设多个代理；专属列表耗尽后默认回退全局，可单独关闭。
      # - 'PROXY_URLS=["socks5://global-first:1080","http://global-second:8080"]'
      # - PROXY_URL=vless://uuid@host:port?security=tls&type=ws&path=%2F&host=xxx&sni=xxx#name
      # sing-box 二进制路径（默认自动探测 /usr/local/bin/sing-box）：
      # - SINGBOX_BIN=/usr/local/bin/sing-box
      # sing-box 空闲实例回收阈值（分钟，0 = 不回收，默认 30）：
      # - SINGBOX_IDLE_MINUTES=30
      # 出站保活：定期 GET 该 URL（默认 60 秒一次），防止免费平台冻结闲置实例。
      # 典型用法：填自己的 /healthz；留空 = 不启动（零开销）。控制台可热改。
      # - KEEPALIVE_URL=https://你的域名/healthz
      # - KEEPALIVE_INTERVAL=60
    # init: true 用 tini 兜底收尸：桥接子进程（vertex-proxy-bridge/sing-box）
    # 异常退出后不留僵尸进程，Python 侧的回收器只做兜底。
    init: true
    # SEC-P3-7：容器加固——本项目不需要任何 Linux capabilities（桥接器用
    # 非特权 TURN/SSTP 出站连接），全部丢弃；no-new-privileges 禁止运行期
    # 经 setuid/setgid 提权；内存上限防止异常输入把宿主内存吃穿（生图链
    # 路峰值按 1g 留余量，512MB 容器部署可自行下调）。
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    restart: unless-stopped
