services:
  openai-to-gemini:
    image: ghcr.io/zhu748/vertex2openai:latest
    container_name: vertex2openai
    ports:
      - "8050:7860"
    volumes:
      # S-3：不挂卷的话，docker compose up --force-recreate 或升级镜像后
      # web_state.json 会丢失，Cookie 与全部控制台设置都要重配。
      - ./data:/app/data
    environment:
      # 状态文件目录（web_state.json 落在这里）
      - STATE_DIR=/app/data
      # Protect this adapter's OpenAI-compatible API.
      # ⚠️ 必须改成强口令：它既是本代理的 API Key，也是控制台登录密码
      - API_KEY=change-me-please
      # Required: one or more Gemini Express Mode API keys, separated by commas.
      - VERTEX_EXPRESS_API_KEY=your_vertex_express_api_key
      # Optional: set true to rotate Express keys in order instead of random selection.
      - ROUNDROBIN=false
      # Optional: fake streaming keeps client connections alive while waiting for non-streaming Gemini responses.
      - FAKE_STREAMING=false
      - FAKE_STREAMING_INTERVAL=1.0
      # Optional: 全局出站代理（仅作初始值，控制台保存后以控制台为准）。
      # 支持 http:// / https:// / socks5:// / socks5h:// 原生协议，
      # 也可直接填 vless:// vmess:// trojan:// ss:// socks4:// hysteria2:// tuic://
      # 分享链接（镜像内已置 sing-box，自动转成本地 socks5）。
      # 每个 Express Key 还可在控制台「通道与凭证」页单独设代理（Key 级优先）。
      # - PROXY_URL=vless://uuid@host:port?security=tls&type=ws&path=%2F&host=xxx&sni=xxx#name
      # sing-box 二进制路径（默认自动探测 /usr/local/bin/sing-box）：
      # - SINGBOX_BIN=/usr/local/bin/sing-box
      # sing-box 空闲实例回收阈值（分钟，0 = 不回收，默认 30）：
      # - SINGBOX_IDLE_MINUTES=30
    restart: unless-stopped
